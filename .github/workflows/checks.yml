# Lint, tests and build for every pull request. Mark the "PHP" and "JS"
# checks as required in the branch rulesets (see docs/engineering/git-workflow.md).
name: Checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: composer lint

      # The unit tests still boot WordPress for helpers such as __() and
      # wp_json_encode(). The test library comes from wp-phpunit/wp-phpunit
      # in vendor/, so this step only fetches the matching WordPress core
      # and writes the config that wp-phpunit reads from WP_PHPUNIT__TESTS_CONFIG.
      - name: Set up WordPress for tests
        run: |
          wp_version="$(composer show wp-phpunit/wp-phpunit | sed -n 's/^versions : \* //p')"
          curl -sSfL "https://wordpress.org/wordpress-${wp_version}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          cat > "$RUNNER_TEMP/wp-tests-config.php" <<PHP
          <?php
          define( 'ABSPATH', '$RUNNER_TEMP/wordpress/' );
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'root' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          define( 'WP_TESTS_DOMAIN', 'example.org' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test Blog' );
          define( 'WP_PHP_BINARY', 'php' );
          PHP
          echo "WP_TESTS_DIR=$GITHUB_WORKSPACE/vendor/wp-phpunit/wp-phpunit" >> "$GITHUB_ENV"
          echo "WP_PHPUNIT__TESTS_CONFIG=$RUNNER_TEMP/wp-tests-config.php" >> "$GITHUB_ENV"

      - name: Unit tests
        run: composer test

  js:
    name: JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
