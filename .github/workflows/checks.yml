# Lint, tests and build for every pull request. Mark the "PHP" and "JS"
# checks as required in the branch rulesets (see docs/engineering/git-workflow.md).
name: Checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: composer lint

      # The unit tests still boot WordPress for helpers such as __() and
      # wp_json_encode(), so they need the WordPress test library.
      - name: Install the WordPress test library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      - name: Unit tests
        run: composer test

  js:
    name: JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
